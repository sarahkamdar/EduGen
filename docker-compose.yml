services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edugen-backend
    ports:
      - "8000:8000"
    volumes:
      - whisper_cache:/app/model-cache
      - ./backend/temp:/app/temp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: edugen-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  whisper_cache:
