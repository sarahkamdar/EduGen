name: Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  build-and-deploy:
    name: Build & Deploy to S3 + CloudFront
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        env:
          # Empty string = relative URLs (/auth/*, /content/*)
          # CloudFront proxies /auth/* and /content/* to ALB over HTTPS.
          # Resolves browser Mixed Content errors.
          VITE_API_BASE_URL: ""
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        # --delete removes files that were removed from the repo.
        # This keeps the bucket clean (no stale JS/CSS chunks from old builds).
        run: |
          aws s3 sync frontend/dist/ s3://${{ secrets.S3_FRONTEND_BUCKET }}/ \
            --delete \
            --cache-control "max-age=31536000,immutable"
          # HTML files should NOT be cached long-term (browser needs the latest index.html)
          aws s3 cp frontend/dist/index.html s3://${{ secrets.S3_FRONTEND_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        # After deploying new files to S3, we must invalidate the CDN cache.
        # Without this, users see the old cached index.html for up to 24 hours.
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "✅ Frontend deployment complete."
          echo "   Commit:  ${{ github.sha }}"
          echo "   Bucket:  ${{ secrets.S3_FRONTEND_BUCKET }}"
          echo "   CDN:     ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
