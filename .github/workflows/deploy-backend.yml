name: Deploy Backend (API + Worker)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check backend/app --select E,W,F --ignore E501

  build-and-deploy:
    name: Build & Push Docker Images to ECR & Deploy to ECS
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/edugen-api:${{ github.sha }} -t $ECR_REGISTRY/edugen-api:latest ./backend
          docker push $ECR_REGISTRY/edugen-api:${{ github.sha }}
          docker push $ECR_REGISTRY/edugen-api:latest

      - name: Build and push Worker Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -f ./backend/Dockerfile.worker -t $ECR_REGISTRY/edugen-worker:${{ github.sha }} -t $ECR_REGISTRY/edugen-worker:latest ./backend
          docker push $ECR_REGISTRY/edugen-worker:${{ github.sha }}
          docker push $ECR_REGISTRY/edugen-worker:latest

      - name: Deploy to ECS Fargate
        run: |
          CLUSTER_NAME="${{ secrets.ECS_CLUSTER }}"
          API_SERVICE="${{ secrets.ECS_API_SERVICE }}"
          WORKER_SERVICE="${{ secrets.ECS_WORKER_SERVICE }}"

          aws ecs update-service --cluster ${CLUSTER_NAME:-edugen-cluster} --service ${API_SERVICE:-edugen-api-service} --force-new-deployment
          aws ecs update-service --cluster ${CLUSTER_NAME:-edugen-cluster} --service ${WORKER_SERVICE:-edugen-worker-service} --force-new-deployment
          echo "✅ Triggered ECS Fargate deployment for API and Worker services."
